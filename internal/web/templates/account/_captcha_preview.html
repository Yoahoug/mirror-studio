<div class="mb-2 flex items-center gap-3" data-captcha-block>
  <div class="relative flex-1 overflow-hidden rounded-2xl border border-slate-200/80 bg-[linear-gradient(135deg,#f8fbff_0%,#eef4ff_100%)] p-1 shadow-[inset_0_1px_0_rgba(255,255,255,0.85)]">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(191,219,254,0.45),transparent_42%),radial-gradient(circle_at_bottom_right,rgba(196,181,253,0.18),transparent_38%)]"></div>
    <img
      src="{{ captcha_svg }}"
      alt="验证码图片"
      class="relative block h-14 w-full rounded-[0.95rem] object-cover"
      data-captcha-image
    >
  </div>
  <button
    type="button"
    class="h-14 shrink-0 rounded-2xl border border-slate-200/80 bg-white px-4 text-sm font-semibold text-slate-700 shadow-sm transition hover:border-slate-300 hover:text-slate-950 disabled:cursor-not-allowed disabled:opacity-60"
    data-captcha-refresh
  >
    换一张
  </button>
</div>
<p class="mb-2 pl-1 text-xs text-slate-400">点击右侧刷新，不区分大小写。</p>
<script>
  (function () {
    if (window.__mirrorCaptchaBindingReady) return;
    window.__mirrorCaptchaBindingReady = true;
    document.addEventListener("click", async function (event) {
      var refreshButton = event.target.closest("[data-captcha-refresh]");
      if (!refreshButton) return;
      var container = refreshButton.closest("[data-captcha-block]");
      if (!container) return;
      var image = container.querySelector("[data-captcha-image]");
      if (!image) return;
      refreshButton.disabled = true;
      try {
        var response = await fetch("/api/auth/captcha", { credentials: "same-origin" });
        var payload = await response.json();
        var src = payload && payload.data ? payload.data.captcha_svg : "";
        if (src) image.src = src;
      } catch (error) {
        console.warn("captcha refresh failed", error);
      } finally {
        refreshButton.disabled = false;
      }
    });
  })();
</script>

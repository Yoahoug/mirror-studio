<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-mode="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ BRAND_NAME }} 创作台</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
      .workspace-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8fb;
        color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .workspace-boot__panel {
        display: grid;
        gap: 14px;
        justify-items: center;
        padding: 28px;
        text-align: center;
      }

      .workspace-boot__mark {
        width: 54px;
        height: 54px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      }

      .workspace-boot__spinner {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        border: 3px solid #dbe3f0;
        border-top-color: #2563eb;
        animation: workspace-boot-spin 0.9s linear infinite;
      }

      .workspace-boot__title {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
      }

      .workspace-boot__text {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: #64748b;
      }

      @keyframes workspace-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    
      <link rel="preload" href="/static/workspace/assets/workspace.css?v={{ WORKSPACE_ASSET_VERSION }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
      <noscript><link rel="stylesheet" href="/static/workspace/assets/workspace.css?v={{ WORKSPACE_ASSET_VERSION }}"></noscript>
      <script type="module" src="/static/workspace/assets/workspace.js?v={{ WORKSPACE_ASSET_VERSION }}"></script>
    
  </head>
  <body>
    <div
      id="workspace-root"
      data-mode="online"
      data-user="{% if request.user.is_authenticated %}{{ request.user.username }}{% endif %}"
      data-brand="{{ BRAND_NAME }}"
      data-csrf="{{ csrf_token }}"
      data-authenticated="{% if IS_AUTHENTICATED %}1{% else %}0{% endif %}"
      data-captcha="{{ CAPTCHA_CODE }}"
      data-captcha-svg="{{ CAPTCHA_SVG }}"
    >
      <div class="workspace-boot" role="status" aria-live="polite">
        <div class="workspace-boot__panel">
          <div class="workspace-boot__mark" aria-hidden="true">
            <div class="workspace-boot__spinner"></div>
          </div>
          <p class="workspace-boot__title">正在打开创作台</p>
          <p class="workspace-boot__text">请稍候</p>
        </div>
      </div>
    </div>
    <script id="workspace-release-data" type="application/json">{{ WORKSPACE_RELEASE_JSON|safe }}</script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-mode="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ BRAND_NAME }} 管理控制台</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    {% if CONSOLE_VITE_DEV_URL %}
      <script type="module">
        import RefreshRuntime from "{{ CONSOLE_VITE_DEV_URL }}/@react-refresh";
        RefreshRuntime.injectIntoGlobalHook(window);
        window.$RefreshReg$ = () => {};
        window.$RefreshSig$ = () => (type) => type;
        window.__vite_plugin_react_preamble_installed__ = true;
      </script>
      <script type="module" src="{{ CONSOLE_VITE_DEV_URL }}/@vite/client"></script>
      <script type="module" src="{{ CONSOLE_VITE_DEV_URL }}/src/main.tsx"></script>
    {% else %}
      <link rel="stylesheet" href="/static/console/assets/console.css">
      <script type="module" src="/static/console/assets/console.js"></script>
    {% endif %}
  </head>
  <body>
    <div id="console-root" data-user="{{ request.user.username }}" data-brand="{{ BRAND_NAME }}" data-csrf="{{ csrf_token }}"></div>
  </body>
</html>

<div class="grid gap-4 md:grid-cols-3">
  <div class="panel p-6">
    <p class="text-sm text-slate-500">用户名</p>
    <p class="mt-2 text-lg font-semibold text-slate-900">{{ request.user.username }}</p>
  </div>
  <div class="panel p-6">
    <p class="text-sm text-slate-500">剩余次数</p>
    <p class="mt-2 text-lg font-semibold text-slate-900">{{ quota_summary.available_quota|default:"0" }}</p>
  </div>
  <div class="panel p-6">
    <p class="text-sm text-slate-500">冻结次数</p>
    <p class="mt-2 text-lg font-semibold text-slate-900">{{ quota_summary.frozen_quota|default:"0" }}</p>
  </div>
</div>

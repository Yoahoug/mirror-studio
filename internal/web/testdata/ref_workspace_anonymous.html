      .workspace-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8fb;
        color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .workspace-boot__panel {
        display: grid;
        gap: 14px;
        justify-items: center;
        padding: 28px;
        text-align: center;
      }

      .workspace-boot__mark {
        width: 54px;
        height: 54px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      }

      .workspace-boot__spinner {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        border: 3px solid #dbe3f0;
        border-top-color: #2563eb;
        animation: workspace-boot-spin 0.9s linear infinite;
      }

      .workspace-boot__title {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
      }

      .workspace-boot__text {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: #64748b;
      }

      @keyframes workspace-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

      :root {

      }

      .btn-secondary:hover {

        color: var(--am-primary) !important;

      }

      /* Table overrides */

      }

        font-weight: 800;
        text-transform: uppercase;

<script>
  (function () {
    if (window.__mirrorCaptchaBindingReady) return;
    window.__mirrorCaptchaBindingReady = true;
    document.addEventListener("click", async function (event) {
      var refreshButton = event.target.closest("[data-captcha-refresh]");
      if (!refreshButton) return;
      var container = refreshButton.closest("[data-captcha-block]");
      if (!container) return;
      var image = container.querySelector("[data-captcha-image]");
      if (!image) return;
      refreshButton.disabled = true;
      try {
        var response = await fetch("/api/auth/captcha", { credentials: "same-origin" });
        var payload = await response.json();
        var src = payload && payload.data ? payload.data.captcha_svg : "";
        if (src) image.src = src;
      } catch (error) {
        console.warn("captcha refresh failed", error);
      } finally {
        refreshButton.disabled = false;
      }
    });
  })();
</script>

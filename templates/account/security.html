{% extends "base.html" %}

{% block title %}安全设置 - {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="site-shell py-10">
  <div class="mx-auto max-w-xl panel p-8">
    <h1 class="text-2xl font-semibold text-slate-950">安全设置</h1>
    <p class="mt-2 text-slate-600">如需修改密码，可直接调用重置接口。</p>
    <form class="mt-6 space-y-4" hx-post="/api/auth/reset-password" hx-target="#security-result" hx-swap="innerHTML">
      {% csrf_token %}
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">账号</label>
        <input class="w-full rounded-xl border border-slate-200 px-3 py-2" name="username" value="{{ request.user.username }}" readonly>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">邮箱</label>
        <input class="w-full rounded-xl border border-slate-200 px-3 py-2" name="email" value="{{ request.user.email }}">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">新密码</label>
        <input class="w-full rounded-xl border border-slate-200 px-3 py-2" name="new_password" type="password">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">确认新密码</label>
        <input class="w-full rounded-xl border border-slate-200 px-3 py-2" name="confirm_password" type="password">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">验证码</label>
        {% include "account/_captcha_preview.html" %}
        <input class="w-full rounded-xl border border-slate-200 px-3 py-2" name="captcha_code">
      </div>
      <button class="btn-primary" type="submit">提交修改</button>
    </form>
    <div id="security-result" class="mt-4 text-sm text-slate-500"></div>
  </div>
</section>
{% endblock %}

name: mirror-studio

# 0.0.1 是单二进制 + SQLite：一个进程内嵌迁移、幂等种子与后台 worker，
# 因此只有一个服务、一个卷。启动失败会打印原因并退出（docker compose logs app）。
services:
  app:
    build:
      context: .
      # 构建段要拉 npm 依赖与 Go 模块。默认 buildkit 桥接网络在受限环境下
      # 没有外网路由，host 网络最稳；如你的环境桥接可直连，删掉这行即可。
      network: host
    image: mirror-studio-app
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      # DATABASE_URL 由镜像内置为 sqlite:////app/data/db.sqlite3，
      # 如需换路径在这里覆盖（0.0.1 只接受 sqlite，见 internal/config/config.go）。
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8000}
      USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST:-0}
      TRUST_X_FORWARDED_FOR: ${TRUST_X_FORWARDED_FOR:-0}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:-4}
      HTTP_PROXY: ${EXTERNAL_HTTP_PROXY:-}
      HTTPS_PROXY: ${EXTERNAL_HTTP_PROXY:-}
      NO_PROXY: ${EXTERNAL_NO_PROXY:-localhost,127.0.0.1}
    volumes:
      - app_data:/app/data
    ports:
      - "${HTTP_PORT:-8000}:8000"

volumes:
  app_data:

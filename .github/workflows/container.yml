# 构建容器镜像并发布到 GHCR（GitHub Container Registry）。
#
# 触发策略：只在需要产出镜像时构建，普通提交（含 main 推送）不触发，
#   - push v* 版本标签：正式发布流程（scripts/release.py 打标签）的一部分
#   - workflow_dispatch：手动刷新当前 VERSION 的镜像（例如 0.0.1 的日常迭代）
#
# 版本约束：镜像版本号始终取自仓库根的 VERSION 文件（唯一修改者是
# scripts/release.py），workflow 不自行推导、不递增版本。
#
# 镜像：ghcr.io/yoahoug/mirror-studio（公开包）
# 标签：VERSION（当前 0.0.1）、latest（默认分支或版本标签）、sha-<短SHA>；
#       推送 v* 标签时额外产出不带 v 的版本标签。
# 缓存：docker/build-push-action 走 GitHub Actions 构建缓存（type=gha, mode=max），
#       前端 npm ci、Go 模块下载与各构建段都会命中，重复构建显著加快。
name: 构建并发布容器镜像

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/yoahoug/mirror-studio

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 读取 VERSION
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=mirror-studio
            org.opencontainers.image.description=单容器 AI 绘图工作室（Go 单二进制 + SQLite + 内嵌前端）
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
